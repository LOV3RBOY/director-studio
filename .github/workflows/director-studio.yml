name: Director Studio checks

on:
  push:
    branches: [codex/director-studio]
  pull_request:
    branches: [codex/director-studio]

permissions:
  contents: read

concurrency:
  group: director-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TREG_MODE: mock
      SUPER_MODE: mock
      DIRECTOR_MODE: mock
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:registry
      - run: npm run typecheck
      - run: npm run build
      - name: Set up FFmpeg and FFprobe
        timeout-minutes: 5
        run: |
          set -eu
          if command -v ffmpeg && command -v ffprobe; then
            exit 0
          fi
          # Use an archived monthly build from FFmpeg's Linux download listing.
          archive="$RUNNER_TEMP/ffmpeg-linux.tar.xz"
          tools="$RUNNER_TEMP/ffmpeg"
          curl --fail --show-error --silent --location --retry 2 --retry-all-errors \
            --connect-timeout 10 --max-time 80 --output "$archive" \
            https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-10-31-12-59/ffmpeg-n8.1.3-27-g8dca1586f4-linux64-gpl-8.1.tar.xz
          printf '%s  %s\n' 41e9c565594c390622cf968d82fa4135d9e9a11d06c1515644288cbc844e3380 "$archive" | sha256sum --check
          mkdir -p "$tools"
          tar -xJf "$archive" -C "$tools" --strip-components=1 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          "$tools/bin/ffmpeg" -version
          "$tools/bin/ffprobe" -version
          printf '%s\n' "$tools/bin" >> "$GITHUB_PATH"
      - name: Verify server and desktop workspace
        run: npm test
      - name: Verify Studio navigation, Style Proof, and mobile layout
        env:
          UI_SIZE: '390 720'
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          python3 tests/run.py tests/ui/workspace.mjs tests/ui/library.mjs tests/ui/studio-polish.mjs tests/ui/community.mjs

  iphone:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      NEXT_TELEMETRY_DISABLED: '1'
      TREG_MODE: mock
      SUPER_MODE: mock
      DIRECTOR_MODE: mock
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Package and extract iOS sources
        run: |
          set -eu
          xcodebuild -version
          mkdir "$RUNNER_TEMP/package" "$RUNNER_TEMP/xcode"
          cp -R ios/. "$RUNNER_TEMP/package/"
          cd "$RUNNER_TEMP/package"
          printf '%s\n' "$GITHUB_SHA" > REVISION.txt
          zip -qr -X "$RUNNER_TEMP/Director-Studio-Xcode.zip" DirectorStudio.xcodeproj DirectorStudio DirectorStudioUITests INSTALL.md REVISION.txt
          unzip -tq "$RUNNER_TEMP/Director-Studio-Xcode.zip"
          unzip -q "$RUNNER_TEMP/Director-Studio-Xcode.zip" -d "$RUNNER_TEMP/xcode"
      - name: Compile for iPhone with signing disabled
        run: |
          cd "$RUNNER_TEMP/xcode"
          xcodebuild -project DirectorStudio.xcodeproj -scheme DirectorStudio -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/device-build" \
            CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Compile iPhone simulator app and test target
        run: |
          set -eu
          cd "$RUNNER_TEMP/xcode"
          device=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          for runtime in sorted(runtimes, reverse=True):
              if ".iOS-" not in runtime:
                  continue
              devices = [device for device in runtimes[runtime] if device["name"].startswith("iPhone")]
              if devices:
                  device = next((candidate for candidate in devices if candidate["name"] == "iPhone 16 Pro"), devices[0])
                  print(device["udid"])
                  sys.exit(0)
          sys.exit("No available iPhone simulator")
          ')
          printf 'DIRECTOR_SIMULATOR=%s\n' "$device" >> "$GITHUB_ENV"
          xcodebuild -project DirectorStudio.xcodeproj -scheme DirectorStudio -configuration Debug \
            -destination "platform=iOS Simulator,id=$device" -derivedDataPath "$RUNNER_TEMP/simulator-build" \
            -parallel-testing-enabled NO -quiet build-for-testing
      - name: Upload compiled Xcode source package
        uses: actions/upload-artifact@v6
        with:
          name: Director-Studio-Xcode
          path: ${{ runner.temp }}/Director-Studio-Xcode.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Build provider-free server for the iPhone simulator
        run: |
          command -v ffmpeg || brew install ffmpeg
          npm ci
          npm run build
      - name: Wait for the iPhone simulator to finish booting
        timeout-minutes: 7
        run: xcrun simctl bootstatus "$DIRECTOR_SIMULATOR" -b
      - name: Smoke-test with the iPhone simulator
        timeout-minutes: 14
        run: |
          set -eu
          export PARALLAX_DATA_DIR="$RUNNER_TEMP/iphone-server-data"
          node node_modules/next/dist/bin/next start -H 127.0.0.1 -p 3191 >"$RUNNER_TEMP/iphone-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3191/api/auth/me; then break; fi
            sleep 1
          done
          python3 tests/seed_director_ios.py http://127.0.0.1:3191
          cd "$RUNNER_TEMP/xcode"
          xcodebuild -project DirectorStudio.xcodeproj -scheme DirectorStudio -configuration Debug \
            -destination "platform=iOS Simulator,id=$DIRECTOR_SIMULATOR" -derivedDataPath "$RUNNER_TEMP/simulator-build" \
            -parallel-testing-enabled NO -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath "$RUNNER_TEMP/DirectorSmoke.xcresult" test-without-building
      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Director-Studio-Simulator-Verification
          path: ${{ runner.temp }}/DirectorSmoke.xcresult
          if-no-files-found: ignore
          retention-days: 14
