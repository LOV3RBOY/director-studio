name: Director Studio checks

on:
  push:
    branches: [codex/director-studio]

permissions:
  contents: read

concurrency:
  group: director-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TREG_MODE: mock
      SUPER_MODE: mock
      DIRECTOR_MODE: mock
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:registry
      - run: npm run typecheck
      - run: npm run build
      - run: python3 tests/run.py tests/core_e2e.py tests/cinema.py tests/super_hermes.py
